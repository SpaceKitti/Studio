<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="-270 -210 460 340">
  <rect x="-270" y="-210" width="460" height="340" fill="#1a1a1e"/>
  <text x="-40" y="-195" fill="#eee" font-family="sans-serif" font-size="8" text-anchor="middle">M1_RaidStores layout (m×10 units) — Hardware W / Street / Grocery E</text>
  <!-- scale: 1 unit = 0.1 m ; coords already *10 -->
  <g transform="scale(10,-10)">
    <!-- street -->
    <rect x="-4.5" y="-13" width="9" height="26" fill="#3a3a40" stroke="#aaa" stroke-width="0.05"/>
    <rect x="-6" y="-13" width="1.5" height="26" fill="#6a6a66" stroke="#888" stroke-width="0.04"/>
    <rect x="4.5" y="-13" width="1.5" height="26" fill="#6a6a66" stroke="#888" stroke-width="0.04"/>
    <!-- hardware -->
    <rect x="-18" y="-9" width="12" height="18" fill="#8a8680" stroke="#222" stroke-width="0.08"/>
    <rect x="-18" y="-17" width="12" height="8" fill="#5a7a50" stroke="#222" stroke-width="0.08"/>
    <rect x="-24" y="-4" width="6" height="8" fill="#7a6a50" stroke="#222" stroke-width="0.08"/>
    <!-- grocery -->
    <rect x="6" y="-6" width="10" height="12" fill="#8a8680" stroke="#222" stroke-width="0.08"/>
    <rect x="6.2" y="4.6" width="9.6" height="1.2" fill="#6a90a0" stroke="#222" stroke-width="0.05"/>
    <!-- door gaps -->
    <line x1="-6" y1="-0.7" x2="-6" y2="0.7" stroke="#00ff66" stroke-width="0.25"/>
    <line x1="6" y1="-0.7" x2="6" y2="0.7" stroke="#00ff66" stroke-width="0.25"/>
    <line x1="-13.25" y1="-9" x2="-10.75" y2="-9" stroke="#00e5ff" stroke-width="0.25"/>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#111">
    <text x="-120" y="20" text-anchor="middle" font-weight="bold">HardwareMainFloor 12×18</text>
    <text x="-120" y="120" text-anchor="middle" font-weight="bold">HardwareGardenFloor 12×8</text>
    <text x="-210" y="20" text-anchor="middle" fill="#eee">Stock 6×8</text>
    <text x="0" y="20" text-anchor="middle" fill="#eee">StreetFloor 9×26</text>
    <text x="110" y="20" text-anchor="middle" font-weight="bold">GroceryFloor 10×12</text>
    <text x="110" y="-55" text-anchor="middle" fill="#041">Cooler</text>
  </g>
  <text x="-260" y="120" fill="#0f6" font-family="sans-serif" font-size="12">lime = street door gaps 1.4m</text>
  <text x="-260" y="138" fill="#0cf" font-family="sans-serif" font-size="12">cyan = garden opening 2.5m</text>
</svg>
