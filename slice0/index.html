<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio — Slice 0</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="wrap">
    <header>
      <h1>Studio — Slice 0</h1>
      <p class="tagline">The city failed upstairs and down the street — your balcony is still yours.</p>
    </header>
    <canvas id="game" width="960" height="540" aria-label="Slice 0 balcony prototype"></canvas>
    <aside id="hud">
      <div id="help">
        <strong>Controls</strong>
        <span>WASD / Arrows — move</span>
        <span>Space — jump</span>
        <span>E — interact</span>
      </div>
      <div id="status" role="status">Quiet after the crowd fled. Check the neighbor balcony.</div>
      <div id="toast" hidden></div>
    </aside>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
